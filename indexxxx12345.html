<!DOCTYPE html>
<html>
<head>
    <style>
        .divboxen {
            width: 500px;
            height: 500px;
            background-color: pink;
            border: 0.2em solid darkmagenta;
        }


    </style>
</head>
<body>
    <h1>hello world </h1>
<form action="https://formspree.io/f/xzdkvdkz" method="POST">
    <h3>Hire me:</h3>

    <label>
        Your first name:
        <input type="text" name="firstName">
    </label>

    <label>
        Your last name:
        <input type="text" name="lastName">
    </label>

    <label>
        Your email:
        <input type="email" name="email">
    </label>

    <label>
        Company name:
        <input type="text" name="company">
    </label>

    <label>
        Your message:
        <textarea name="message"></textarea>
    </label>

    <button type="submit">Submit</button>
</form>


<!-- farbige boxen -->

<div class="divboxen">
    <p style="background-color: aqua; position: static;" >p1</p>
    <p style="background-color: blue; position: relative;" >p2</p>
    <p style="background-color: blueviolet;" >p3</p>
    <p style="background-color: darkgreen;" >p4</p>
</div>

</body>
</html>
